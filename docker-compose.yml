services:
  mysql:
    image: mysql:8.0.39
    container_name: concert_db
    ports:
      - "3306:3306"
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: concert
      MYSQL_USER: concert
      MYSQL_PASSWORD: concert123
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7.2
    container_name: concert_redis
    ports:
      - "6379:6379"
    restart: always

  kafka:
    image: apache/kafka:3.7.0
    container_name: concert_kafka
    ports:
      - "9092:9092"


  prometheus:
    image: prom/prometheus:latest
    container_name: concert_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: concert_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
